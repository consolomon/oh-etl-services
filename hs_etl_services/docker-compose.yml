version: "3.9"

services:
  sample-service:
    build:
      context: ./service-sample
      network: host
    image: service-sample:local
    container_name: service-sample-container
    environment:
      FLASK_APP: ${SAMPLE_SERVICE_APP_NAME:-service_sample}
      DEBUG: ${SAMPLE_SERVICE_DEBUG:-True}

      PG_WAREHOUSE_HOST: ${PG_WAREHOUSE_HOST}
      PG_WAREHOUSE_PORT: ${PG_WAREHOUSE_PORT}
      PG_WAREHOUSE_DBNAME: ${PG_WAREHOUSE_DBNAME}
      PG_WAREHOUSE_USER: ${PG_WAREHOUSE_USER}
      PG_WAREHOUSE_PASSWORD: ${PG_WAREHOUSE_PASSWORD}

    network_mode: "bridge"
    ports:
      - "5011:5000"
    restart: unless-stopped

  postgres-db:
    image: postgres:13
    container_name: oh-postgres-db
    environment:
      POSTGRES_DB: ${PG_WAREHOUSE_DBNAME}
      POSTGRES_USER: ${PG_WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${PG_WAREHOUSE_PASSWORD}
    ports:
      - ${PG_WAREHOUSE_PORT}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: oh-metabase
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "always"
    ports:
      - "4040:4040"
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: ${MB_DB_HOST}
      MB_JETTY_PORT: ${MB_JETTY_PORT}
